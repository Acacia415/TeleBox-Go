name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build TeleBox-Go
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/release dist/stage

          for goarch in amd64 arm64; do
            goos="linux"
            package="telebox-go_${version}_${goos}_${goarch}"
            stage="dist/stage/${package}"
            mkdir -p "${stage}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath \
              -ldflags "-s -w \
                -X github.com/Acacia415/TeleBox-Go/internal/buildinfo.Version=${version} \
                -X github.com/Acacia415/TeleBox-Go/internal/buildinfo.Commit=${commit} \
                -X github.com/Acacia415/TeleBox-Go/internal/buildinfo.Date=${built_at}" \
              -o "${stage}/telebox" ./cmd/telebox
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "-s -w" \
              -o "${stage}/telebox-migrate" ./cmd/telebox-migrate

            cp config.example.json README.md scripts/install.sh "${stage}/"
            tar -C dist/stage -czf "dist/release/${package}.tar.gz" "${package}"
          done

      - name: Add plugin catalog compatibility snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/catalog
          if ! gh release download plugin-registry \
            --pattern plugin-catalog.json \
            --dir dist/catalog; then
            echo "plugin-registry is missing; bootstrapping from the latest stable release"
            gh release download \
              --pattern plugin-catalog.json \
              --dir dist/catalog
            (
              cd dist/catalog
              sha256sum plugin-catalog.json > plugin-catalog.sha256
            )
            gh release create plugin-registry \
              dist/catalog/plugin-catalog.json \
              dist/catalog/plugin-catalog.sha256 \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "TeleBox-Go Plugin Registry" \
              --notes "Mutable official plugin catalog. Plugin packages are published as independent pre-releases."
          fi
          cp dist/catalog/plugin-catalog.json dist/release/plugin-catalog.json

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/release/* \
            --verify-tag \
            --generate-notes \
            --title "TeleBox-Go ${GITHUB_REF_NAME}"
